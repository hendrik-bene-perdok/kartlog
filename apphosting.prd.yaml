# Firebase App Hosting configuration for Kartlog MVP
# See: https://firebase.google.com/docs/app-hosting/configure

# Settings for Cloud Run
runConfig:
  minInstances: 0  # Scale to zero when not in use (cost-effective for MVP)
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables for Next.js
env:
  # Firebase Configuration (required for client-side Firebase SDK)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyC_a9TjWt_7UGtL2MI1BvMPEHVanuc8yXU
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: kartlog-a1beb.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: kartlog-a1beb
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: kartlog-a1beb.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "904009954950"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:904009954950:web:d2cf21055fb530f48d8307
    availability:
      - BUILD
      - RUNTIME
